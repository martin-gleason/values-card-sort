# SPDX-License-Identifier: GPL-3.0-or-later
#
# Source of truth for ValuesCardSort.xcodeproj, which is GENERATED and
# gitignored. Run scripts/bootstrap.sh after changing this file.
#
# Why generated: the project file is the one artifact in this repo that an
# agent edits unreliably and a human cannot review in a diff. Keeping it out of
# git means every structural change to the app shows up as a readable change
# here instead.

name: ValuesCardSort

options:
  bundleIdPrefix: com.martygleason.valuescardsort
  deploymentTarget:
    # Ratified 2026-08-14 (SPEC §11 O1). Built against the current SDK so
    # system chrome inherits the current design language on recompile.
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  minimumXcodeGenVersion: "2.42.0"

packages:
  ValuesCardSortKit:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # SPEC §7: nothing here may imply the app talks to a network.
    ENABLE_HARDENED_RUNTIME: YES

targets:
  ValuesCardSort:
    type: application
    # One codebase, three platforms (SPEC §3). iPadOS rides with iOS.
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
    dependencies:
      - package: ValuesCardSortKit
        product: ValuesCardSortKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Values Card Sort
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # SPEC §7: the app makes no network connections, so there is no
        # encryption to declare.
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: >-
          GPL-3.0-or-later. Instrument: Miller, C'de Baca, Matthews and
          Wilbourne, University of New Mexico, 2001. Public domain.
        # Portrait and landscape everywhere — the sort screen must work at the
        # largest Dynamic Type size, which needs the room (SPEC §6).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/ValuesCardSort.entitlements
      properties:
        # App Sandbox with NO network client or server entitlement. SPEC §7 is
        # binding, and this is the OS-level half of enforcing it:
        # scripts/check-privacy.sh keeps the imports out, this keeps the
        # capability off.
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martygleason.valuescardsort
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        # Chore C2 supplies the team; unsigned local builds work without it.
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES

  ValuesCardSortTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests/ValuesCardSortAppTests
    dependencies:
      - target: ValuesCardSort
      - package: ValuesCardSortKit
        product: ValuesCardSortKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martygleason.valuescardsort.tests
        GENERATE_INFOPLIST_FILE: YES
        # One test target, two bundle layouts: a macOS app nests its executable
        # in Contents/MacOS, an iOS app does not. Without the per-SDK split the
        # macOS test action cannot find its host and fails before compiling.
        TEST_HOST[sdk=macosx*]: "$(BUILT_PRODUCTS_DIR)/ValuesCardSort.app/Contents/MacOS/ValuesCardSort"
        TEST_HOST[sdk=iphoneos*]: "$(BUILT_PRODUCTS_DIR)/ValuesCardSort.app/ValuesCardSort"
        TEST_HOST[sdk=iphonesimulator*]: "$(BUILT_PRODUCTS_DIR)/ValuesCardSort.app/ValuesCardSort"
        BUNDLE_LOADER: "$(TEST_HOST)"

  ValuesCardSortUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests/ValuesCardSortUITests
    dependencies:
      - target: ValuesCardSort
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martygleason.valuescardsort.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ValuesCardSort:
    build:
      targets:
        ValuesCardSort: all
        ValuesCardSortTests: [test]
        ValuesCardSortUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - ValuesCardSortTests
        - ValuesCardSortUITests
    run:
      config: Debug
